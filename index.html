<!DOCTYPE html>
<html>
<head>
    <title>Auto mensajes apartamentos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app">
        <h1>Auto mensajes apartamentos</h1>
        
        <label for="name">Nombre:</label>
        <input type="text" id="name" placeholder="Nombre del huésped">
        
        <label for="apartment">Apartamento:</label>
        <select id="apartment">
            <option value="">Selecciona apartamento</option>
            <option value="1A">1A</option>
            <option value="1B">1B</option>
            <option value="2A">2A</option>
            <option value="2B">2B</option>
            <option value="3A">3A</option>
            <option value="3B">3B</option>
        </select>
        
        <label for="cider">Sidra:</label>
        <select id="cider">
            <option value="NO">NO</option>
            <option value="SI" selected>SI</option>
        </select>
        
        <button id="generate">Generar mensaje</button>
        
        <label for="message">Mensaje generado:</label>
        <textarea id="message" rows="10" readonly></textarea>
        
        <div class="buttons">
            <button id="copy">Copiar mensaje</button>
            <button id="booking">Abrir mensajes en Booking</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
